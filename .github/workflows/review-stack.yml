name: Review Stack
# review-stack-control: refresh marker for reusable workflow, action, and safe scanner output updates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-stack:
    uses: madmoneymike5/review-stack-control/.github/workflows/review-stack.yml@v1
    with:
      native-command: >-
        npm ci --ignore-scripts && npm run typecheck
      central-ref: v1
